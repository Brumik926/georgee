name: CI

on:
  push:
    branches:
      - main
      - ui-functional-first-pass
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        id: tests
        run: bun run test
        continue-on-error: true

      - name: Run ESLint (excluding repository-wide Prettier formatting debt)
        id: lint
        run: "bun run lint -- --rule 'prettier/prettier: off'"
        continue-on-error: true

      - name: Build production app
        id: build
        run: bun run build
        continue-on-error: true

      - name: TypeScript type check
        id: typecheck
        run: bunx tsc --noEmit
        continue-on-error: true
      - name: Fail if any verification step failed
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
